name: Compilar para Windows

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Copiar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pygame yt-dlp pillow pyinstaller

    - name: Generar ejecutable con PyInstaller
      run: |
        pyinstaller --noconsole --onedir main.py

    - name: Comprimir carpeta en ZIP
      run: |
        Compress-Archive -Path dist/main -DestinationPath Culke-Windows-Portable.zip

    - name: Subir el resultado como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: Culke-Windows-Portable
        path: Culke-Windows-Portable.zip
