name: Compilar para Windows

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Copiar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pygame yt-dlp pillow imageio-ffmpeg pyinstaller

    - name: Generar ejecutable único con PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name Culke main.py

    - name: Subir el resultado como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: Culke-Windows-Unico
        path: dist/Culke.exe
